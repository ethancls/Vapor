# air — Go hot reload config
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_ENABLED=0 go build -o ./tmp/eve ."
  entrypoint = "./tmp/eve"
  include_ext = ["go"]
  exclude_dir = ["frontend", "tmp", "backend", "backend_python", "deploy", "scripts"]
  delay = 500

[log]
  main_only = true

[color]
  main = "magenta"
  build = "yellow"
  runner = "green"
